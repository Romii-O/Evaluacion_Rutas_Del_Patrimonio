<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>formulario</title>
    <link rel="icon" href="../img/pngegg.png" type="image/x-icon"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/validacion.js"></script>
</head>
<body>
<form id="formulario" class="row g-3">
    <div class="d-grid gap-2 col-6 mx-auto">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre">
        <div id="nombreError" class="text-danger small"></div>
    </div>
    <div class="col-md-6">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" class="form-control" id="apellido" placeholder="Ingrese su apellido">
        <div id="apellidoError" class="text-danger small"></div>
    </div>
    <div class="col-md-6">
        <label for="mail" class="form-label">Correo</label>
        <input type="text" class="form-control" id="mail" placeholder="usuario@gmail.com">
        <div id="emailError" class="text-danger small"></div>
    </div>
    <div class="col-md-6">
        <label for="telefono" class="form-label">Teléfono</label>
        <input type="text" class="form-control" id="telefono" placeholder="+56 9 1234 5678">
        <div id="telefonoError" class="text-danger small"></div>
    </div>
    <div id="fechaNacimiento" class="col-md-6">
        <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
        <input type="date" class="form-control" id="fechaNacimiento">
        <div id="fechaError" class="text-danger small"></div>
    </div>
    <div id="region" class="col-md-6">
        <label for="autoSizingSelect" class="form-label">Región</label>
        <select class="form-select" id="autoSizingSelect">
            <option selected>Seleccione su región</option>
            <option value="1">Región de Arica y Parinacota</option>
            <option value="2">Región de Tarapacá</option>
            <option value="3">Región de Antofagasta</option>
            <option value="4">Región de Atacama</option>
            <option value="5">Región de Coquimbo</option>
            <option value="6">Región de Valparaíso</option>
            <option value="7">Región Metropolitana</option>
            <option value="8">Región del Libertador General Bernardo O’Higgins</option>
            <option value="9">Región del Maule</option>
            <option value="10">Región del Biobío</option>
            <option value="11">Región de La Araucanía</option>
            <option value="12">Región de Los Ríos</option>
            <option value="13">Región de Los Lagos</option>
            <option value="14">Región de Aysén del General Carlos Ibáñez del Campo</option>
            <option value="15">Región de Magallanes y de la Antártica Chilena</option>
        </select>
        <div id="regionError" class="text-danger small"></div>
    </div>
    <div id="eduacion" class="col-md-6">
        <label class="form-label">Nivel educacional</label>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="Tecnico" id="nivelMedia">
            <label class="form-check-label" for="nivelMedia">Enseñanza media</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="Tecnico" id="nivelTecnico">
            <label class="form-check-label" for="nivelTecnico">Técnico</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="Tecnico" id="nivelUniversitario">
            <label class="form-check-label" for="nivelUniversitario">Universitario</label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="radio" name="Tecnico" id="nivelOtro">
            <label class="form-check-label" for="nivelOtro">Otro</label>
        </div>
        <div id="educacionError" class="text-danger small"></div>
    </div>

    <div class="col-12">
        <button type="submit" class="btn btn-primary">Enviar</button>
        <a href="../index.html" class="btn btn-secondary">Atrás</a>
    </div>
</form>
</body>
</html>
